<title>Little Lives — House</title>

<script type="module">
// Stage 1 house proof: loads assets/house/house.glb, adds warm room lights at Light_* empties, tabletop camera.

import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +(q.get('exp') || 1.0);

const scene = new THREE.Scene();

scene.environmentIntensity = 0.12;
// Round 18 backdrop: out-of-focus living room like the board — cool blue-grey window light on the left, dark

{ const c = document.createElement('canvas'); c.width = 768; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 768, 0); gr.addColorStop(0, '#4c5468'); gr.addColorStop(0.35, '#2c2e2c'); gr.addColorStop(0.75, '#2a2c22'); gr.addColorStop(1, '#3a3426');
  g.fillStyle = gr; g.fillRect(0, 0, 768, 512);
  g.fillStyle = 'rgba(120,130,150,0.55)'; g.fillRect(20, 40, 120, 300); g.fillRect(150, 40, 70, 300);           // window panes, left
  g.fillStyle = 'rgba(40,36,30,0.9)'; g.fillRect(0, 330, 768, 182);                                              // room floor/furniture band
  for (const [x, y, r, col] of [[640, 300, 90, 'rgba(60,90,40,0.7)'], [700, 200, 70, 'rgba(70,100,50,0.6)'], [560, 120, 60, 'rgba(50,80,40,0.5)'], [90, 420, 80, 'rgba(110,70,80,0.4)']]) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, 768, 512); }
  g.filter = 'blur(10px)'; g.drawImage(c, 0, 0); g.filter = 'none';
  for (const [x, y, r, a] of [[720, 250, 34, 0.95], [690, 330, 12, 0.6], [40, 470, 16, 0.4], [120, 460, 10, 0.35], [600, 470, 14, 0.4], [300, 470, 9, 0.3]]) {   // bokeh
    const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, `rgba(255,214,150,${a})`); rg.addColorStop(0.75, `rgba(255,200,130,${a * 0.85})`); rg.addColorStop(1, 'rgba(255,200,130,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
scene.add(new THREE.HemisphereLight(0x8a9ac0, 0x2a2018, 0.30));   // cool dusk ambient vs warm interior (round 18)
const moon = new THREE.DirectionalLight(0xa8b8ff, 0.45); moon.position.set(-6, 10, 8); scene.add(moon);
const front = new THREE.DirectionalLight(0xffd8a8, +(q.get('front') || 0.9)); front.position.set(3, 4, 12); front.castShadow = true;
front.shadow.mapSize.set(2048, 2048); Object.assign(front.shadow.camera, { left: -7, right: 7, top: 9, bottom: -1, near: 1, far: 30 }); front.shadow.bias = -0.0005; front.shadow.normalBias = 0.02;
scene.add(front);

const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 26), innerWidth / innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), +(q.get('bloom') || 0.42), 0.45, 0.82));
composer.addPass(new OutputPass());
const draw = () => composer.render();

const REFV = q.get('view') === 'ref', MASK = q.get('mask') === '1';
const FIRE = [];
// fireplace flicker (round 18): layered sines; static renders (?view=ref / QA) stay at t=0 so rounds are comparable
function flicker(t) { for (const L of FIRE) { L.userData.base ??= L.intensity; L.intensity = L.userData.base * (0.85 + 0.10 * Math.sin(t * 9.1) + 0.06 * Math.sin(t * 23.7 + 1.3) + 0.04 * Math.sin(t * 3.3)); } }
new GLTFLoader().load(q.get('model') || '../assets/house/house.glb', async (g) => {
  const root = g.scene; scene.add(root);
  if (MASK) {
    const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
    root.traverse((o) => { if (o.isMesh) { if (o.name.startsWith('tabletop') || o.name.startsWith('backdrop')) o.visible = false; else o.material = white; } });
    scene.background = new THREE.Color(0); scene.environment = null; renderer.toneMapping = THREE.NoToneMapping;
  }
  const lights = [];
  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      const m = o.material;
      if (m.name.startsWith('lamp') || m.name === 'fire' || m.name.startsWith('window')) { o.castShadow = false; }
    }
    if (o.name.startsWith('Light_')) lights.push(o);
  });
  const P = +(q.get('lux') || 4.2);   // room light power ('room' is the close-up selector)
  for (const e of lights) {
    const fire = e.name === 'Light_fire';
    const L = new THREE.PointLight(fire ? 0xff6a1a : 0xffa238, fire ? P * 0.8 : P, fire ? 2.6 : 4.2, 1.4);   // amber (board interiors ~ 210,112,7)
    if (fire) FIRE.push(L);
    e.add(L);
  }
  if (REFV) {
    const ref = await (await fetch('../refs/house_landmarks.json')).json();
    const K = +(q.get('K') || 2);
    const cam = { ...HOUSE_CAM };
    for (const [k, key] of [['fov', 'fovDeg'], ['el', 'elevDeg'], ['yaw', 'yawDeg']]) if (q.get(k) !== null) cam[key] = +q.get(k);
    const fit = fitHouseCamera(root, camera, ref, K, cam);
    renderer.setSize(fit.W, fit.H, false); renderer.domElement.style.width = fit.W + 'px'; renderer.domElement.style.height = fit.H + 'px';
    composer.setSize(fit.W, fit.H);
    window.MEASURE = fit;
    window.FIT = (c) => fitHouseCamera(root, camera, ref, K, { ...HOUSE_CAM, ...c });   // calibration hook
    const d2 = MASK ? () => renderer.render(scene, camera) : draw;
    window.DRAW = d2;
    renderer.info.autoReset = false;
    window.STATS = () => { renderer.info.reset(); renderer.render(scene, camera); const r = renderer.info.render;
      let meshes = 0, tris = 0; root.traverse((o) => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
      return { calls: r.calls, triangles_drawn: r.triangles, meshes, scene_tris: Math.round(tris) }; };
    d2(); requestAnimationFrame(() => { d2(); window.READY = true; });
    return;
  }
  // ?char=<glb url>&at=<interaction id>[,<id>...] : drop in characters (web/lib/characters.js contract)
  if (q.get('char')) {
    const data = await (await fetch('../assets/house/house_data.json')).json();
    const ids = (q.get('at') || 'living.fireplace.0').split(',');
    window.CHARS = [];
    for (const id of ids) {
      const ip = data.interactions.find((i) => i.id === id); if (!ip) continue;
      const c = await loadCharacter(q.get('char'), renderer, { normalizeTo: q.get('normalize') ? +q.get('normalize') : null });
      scene.add(placeAt(c.object, ip)); window.CHARS.push({ at: id, ...c.report });
    }
  }
  // ?ips=1 : interaction-point overlay (stand point sphere + facing arrow, colour by kind) from IP_ empties
  if (q.get('ips') === '1') {
    const KC = { sit: 0x40a0ff, sleep: 0x9060ff, open: 0x40e070, use: 0xffd040, switch: 0xff5050, bathe: 0x40e0e0, climb: 0xffffff };
    root.traverse((o) => {
      if (!o.name.startsWith('IP_')) return;
      const u = o.userData || {}; const c = KC[u.ip_kind] ?? 0xff00ff;
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), new THREE.MeshBasicMaterial({ color: c, depthTest: false }));
      m.renderOrder = 10; o.add(m);
      const face = u.ip_face_x !== undefined ? null : null;
    });
    // facing arrows from the JSON (userData can't hold arrays)
    const data = await (await fetch('../assets/house/house_data.json')).json();
    for (const ip of data.interactions) {
      const from = new THREE.Vector3(ip.stand[0], ip.stand[2] + 0.06, -ip.stand[1]);
      const dir = new THREE.Vector3(ip.face[0], 0, -ip.face[1]);
      const ar = new THREE.ArrowHelper(dir, from, 0.28, KC[ip.kind] ?? 0xff00ff, 0.1, 0.07); ar.traverse((x) => { if (x.material) { x.material.depthTest = false; x.renderOrder = 11; } });
      scene.add(ar);
    }
  }

  const closeName = q.get('floor') ? 'Floor_' + q.get('floor') : q.get('room') ? 'Room_' + q.get('room') : null;
  if (closeName) {
    const m = root.getObjectByName(closeName);
    if (m) {
      const u = m.userData || {}; const c = m.getWorldPosition(new THREE.Vector3());
      camera.fov = q.get('room') ? 34 : 28; camera.updateProjectionMatrix();
      const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
      const w = (u.w || 3) * 1.08, h = (u.h || 2) * 1.15;
      const dist = Math.max(h / 2 / Math.tan(vf / 2), w / 2 / Math.tan(hf / 2)) + (q.get('room') ? 0.4 : 0);
      const el = THREE.MathUtils.degToRad(q.get('room') ? 10 : 7);

  const ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());

}, undefined, (e) => { document.title = 'ERR ' + e; window.READY = 'error'; });
controls.addEventListener('change', draw);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); draw(); });
